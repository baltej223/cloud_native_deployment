AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloud platform on one EC2 instance. Docker runs the platform (Compose) and the
  user apps; app URLs are http://<public-ip>:8001-8050. Sized for the AWS free tier.

Parameters:
  Domain:
    Type: String
    Description: Host name for the dashboard, for example deploy.example.com. Point its DNS A record at the ElasticIp output.
    AllowedPattern: ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Free-tier eligible in most Regions (t2.micro in a few).
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 30
    Description: Root disk in GiB (the free tier covers 30).
  RepoUrl:
    Type: String
    Default: https://github.com/baltej223/cloud_native_deployment.git
  Branch:
    Type: String
    Default: main
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cloud platform - HTTPS dashboard and app ports
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 80,
            ToPort: 80,
            CidrIp: 0.0.0.0/0,
            Description: HTTP for certificates and redirects,
          }
        - {
            IpProtocol: tcp,
            FromPort: 443,
            ToPort: 443,
            CidrIp: 0.0.0.0/0,
            Description: Dashboard and API over HTTPS,
          }
        - {
            IpProtocol: tcp,
            FromPort: 8001,
            ToPort: 8050,
            CidrIp: 0.0.0.0/0,
            Description: User apps,
          }
      Tags: [{ Key: Name, Value: cloud-platform }]

  # No SSH: shell access goes through Systems Manager Session Manager.
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-platform-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloud-platform/domain
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloud-platform/admin-password

  DomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloud-platform/domain
      Type: String
      Value: !Ref Domain

  # A fixed address, so the DNS record keeps working after the instance stops.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: cloud-platform }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      # One hop: containers on Docker networks cannot reach the instance role.
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            {
              VolumeSize: !Ref VolumeSize,
              VolumeType: gp3,
              Encrypted: true,
              DeleteOnTermination: true,
            }
      Tags: [{ Key: Name, Value: cloud-platform }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/cloud-platform-setup.log) 2>&1

          # 2 GiB swap: builds do not fit in 1 GiB of memory.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a

          # Docker Engine with the Compose and Buildx plugins, from Docker's apt repository.
          apt-get update
          apt-get install -y ca-certificates curl git
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker

          git clone --branch ${Branch} ${RepoUrl} /opt/cloud-platform

          # Start the platform on every boot: the public IP can change after a stop.
          cat > /etc/systemd/system/cloud-platform.service <<'UNIT'
          [Unit]
          Description=Cloud platform
          After=docker.service network-online.target
          Requires=docker.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/opt/cloud-platform/deploy/aws/start.sh
          TimeoutStartSec=3600

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cloud-platform.service

Outputs:
  ElasticIp:
    Description: Point the Domain's DNS A record here.
    Value: !Ref ElasticIp
  DashboardUrl:
    Value: !Sub https://${Domain}
  InstanceId:
    Value: !Ref Instance
  SetupLog:
    Description: Open a shell with Session Manager and read this file to follow the first boot.
    Value: /var/log/cloud-platform-setup.log
