# Added on the EC2 server: docker compose -f compose.yaml -f deploy/aws/compose.proxy.yaml
# Caddy serves the dashboard and API over HTTPS on $DOMAIN, and apps on its
# subdomains (see Caddyfile). It joins the apps network to reach them.
services:
  caddy:
    image: docker.io/library/caddy:2.10.0-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, apps]
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
